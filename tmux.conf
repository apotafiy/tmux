set -g mode-keys vi
set -g history-limit 20000
set -g mouse on
set-option -g focus-events on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'

set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Smart pane switching with awareness of Neovim splits.
# Pairs with alexghergh/nvim-tmux-navigation in nvim.
# Uses <prefix> + arrow keys: forwards to nvim if focused, else switches tmux pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -T prefix Left  if-shell "$is_vim" 'send-keys C-b Left'  'select-pane -L'
bind -T prefix Down  if-shell "$is_vim" 'send-keys C-b Down'  'select-pane -D'
bind -T prefix Up    if-shell "$is_vim" 'send-keys C-b Up'    'select-pane -U'
bind -T prefix Right if-shell "$is_vim" 'send-keys C-b Right' 'select-pane -R'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
